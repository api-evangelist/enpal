aid: enpal
name: Enpal
description: 'Enpal is a Berlin-based residential clean-energy company and one of Germany''s
  market leaders in home solar. It sells and finances complete home energy systems —
  rooftop solar PV, battery storage, air-to-water heat pumps, EV wallbox chargers, and a
  dynamic electricity tariff — orchestrated by its Enpal.One+ smart energy-management
  platform, with flexible purchase and zero-down financing options. Enpal serves over
  130,000 German households and operates business (business.enpal.de) and installer partner
  (enpal.pro) channels alongside its consumer offering. Backed by HV Capital and the SoftBank
  Vision Fund. This API Evangelist profile was created from a VC-portfolio lead; Enpal
  publishes a consumer website and customer portal but no public developer API surface at
  the time of enrichment.'
